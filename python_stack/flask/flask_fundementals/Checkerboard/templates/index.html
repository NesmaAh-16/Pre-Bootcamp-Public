<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkerboard</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
    <div class="board">
        {% for i in range(x) %}
            <div class="row">
                {% for j in range(y) %}
                    {% if (i + j) % 2 == 0 %}
                        <div class="red cell"></div>
                    {% else %}
                        <div class="black cell"></div>
                    {% endif %}
                {% endfor %}
            </div>
        {% endfor %}
    </div>
    <div class="board">
        {% for i in range(x) %}
            <div class="row">
                {% for j in range(y) %}
                    {% if (i + j) % 2 == 0 %}
                        <div class="white cell"></div>
                    {% else %}
                        <div class="green cell"></div>
                    {% endif %}
                {% endfor %}
            </div>
        {% endfor %}
    </div>
</body>
</html>
