<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        table { margin: 20px auto; border-collapse: collapse; width: 80%; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Leaderboard</h1>
        <p>Top players with the fewest attempts:</p>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Attempts</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in entries %}
                <tr>
                    <td>{{ entry.name }}</td>
                    <td>{{ entry.attempts }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <p><a href="/reset">Play Again</a></p>
    </div>
</body>
</html>
