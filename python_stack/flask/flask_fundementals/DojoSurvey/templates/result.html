<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Survey Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-5 rounded shadow col-md-6">
        <h3>Submitted Info</h3>
        <hr>
        <p><strong>Name:</strong> {{ data.name }}</p>
        <p><strong>Dojo Location:</strong> {{ data.location }}</p>
        <p><strong>Favorite Language:</strong> {{ data.language }}</p>
        <p><strong>Experience Level:</strong> {{ data.experience }}</p>
        <p><strong>Interests:</strong> {{ ", ".join(data.interests) if data.interests else "None selected" }}</p>
        <p><strong>Comments:</strong> {{ data.comments }}</p>
        
        <a href="/" class="btn btn-secondary mt-3">Go Back</a>
    </div>
</body>
</html>
