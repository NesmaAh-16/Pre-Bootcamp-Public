<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Champion Survey</title>
    <!-- Ninja Bonus: CSS Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 form-container">
                <h2 class="mb-4">Champion Survey</h2>
                <form action="/result" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Your Name:</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Dojo Location:</label>
                        <select name="location" class="form-select">
                            <option value="San Jose">San Jose</option>
                            <option value="Seattle">Seattle</option>
                            <option value="Online">Online</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Favorite Language:</label>
                        <select name="language" class="form-select">
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Java">Java</option>
                        </select>
                    </div>

                    <!-- Ninja Bonus: Radio Buttons -->
                    <div class="mb-3">
                        <label class="form-label d-block">Experience Level:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="experience" value="Beginner" checked>
                            <label class="form-check-label">Beginner</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="experience" value="Advanced">
                            <label class="form-check-label">Advanced</label>
                        </div>
                    </div>

                    <!-- Sensei Bonus: Checkboxes -->
                    <div class="mb-3">
                        <label class="form-label d-block">Learning Interests:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="interests" value="Backend">
                            <label class="form-check-label">Backend</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="interests" value="Frontend">
                            <label class="form-check-label">Frontend</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Comment (optional):</label>
                        <textarea name="comments" class="form-control" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Submit Survey</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
