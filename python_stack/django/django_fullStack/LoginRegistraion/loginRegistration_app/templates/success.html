<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <span class="navbar-brand">User Dashboard</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Log Out</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-5 text-center shadow">
                    <h1 class="display-4 text-success">Success!</h1>
                    <h2 class="mb-4">Welcome, {{ user.first_name }} {{ user.last_name }}!</h2>
                    
                    <div class="alert alert-success d-inline-block">
                        Successfully registered (or logged in)!
                    </div>
                    
                    <div class="mt-4 text-muted">
                        <p>Your unique ID: #{{ user.id }}</p>
                        <p>Account created on: {{ user.created_at|date:"M d, Y" }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
