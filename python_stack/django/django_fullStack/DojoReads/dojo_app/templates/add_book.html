{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title mb-4">Add a New Book Title and a Review:</h3>
                <form action="/books/create" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Book Title:</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Author:</label>
                        <select name="author_id" class="form-select mb-2">
                            <option value="">-- Choose from the list --</option>
                            {% for author in all_authors %}
                            <option value="{{ author.id }}">{{ author.name }}</option>
                            {% endfor %}
                        </select>
                        <label class="form-label">Or add a new author:</label>
                        <input type="text" name="new_author" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Review:</label>
                        <textarea name="review" class="form-control" rows="4" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Rating:</label>
                        <div class="d-flex align-items-center">
                            <select name="rating" class="form-select style="width: 100px;">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                            <span class="ms-2">stars</span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 shadow">Add Book and Review</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
