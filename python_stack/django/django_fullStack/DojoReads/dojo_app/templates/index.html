{% extends 'base.html' %}
{% block content %}
<div class="row">
    <!-- Registration -->
    <div class="col-md-6 border-end">
        <h3>Register</h3>
        <form action="/register" method="POST" class="mt-3">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Name:</label>
                <input type="text" name="name" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Alias:</label>
                <input type="text" name="alias" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" name="password" class="form-control">
                <small class="text-muted">*Password should be at least 8 characters</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm PW:</label>
                <input type="password" name="confirm_password" class="form-control">
            </div>
            <button class="btn btn-primary shadow">Register</button>
        </form>
    </div>

    <!-- Login -->
    <div class="col-md-6 ps-md-5">
        <h3>Login</h3>
        <form action="/login" method="POST" class="mt-3">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" name="password" class="form-control">
            </div>
            <button class="btn btn-success shadow px-4">Login</button>
        </form>
    </div>
</div>
{% endblock %}
