<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Wall{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .wall-card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .comment-box { border-left: 4px solid #dee2e6; margin-left: 2rem; background-color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/wall">CodingDojo Wall</a>
            <div class="navbar-nav ms-auto">
                {% if request.session.user_id %}
                    <span class="navbar-text me-3">Welcome, {{request.session.first_name}}!</span>
                    <a class="nav-link btn btn-outline-light btn-sm" href="/logout">Log Off</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Inside the container, above the content block -->
<div class="container mt-3">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
