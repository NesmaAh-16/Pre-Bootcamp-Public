<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Leaderboard</h1>
    <table border="1" align="center">
        <tr>
            <th>Name</th>
            <th>Attempts</th>
        </tr>
        {% for winner in request.session.winners %}
        <tr>
            <td>{{ winner.name }}</td>
            <td>{{ winner.count }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/">Back to Game</a>
</body>
</html>
