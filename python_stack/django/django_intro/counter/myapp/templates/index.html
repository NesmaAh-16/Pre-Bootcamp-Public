
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter Assignment</title>
    <style>
        body { text-align: center; font-family: sans-serif; margin-top: 50px; }
        button { margin: 5px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Counter</h1>
    <!-- Display the modified counter -->
    <h2>{{ request.session.count }} times</h2>

    <!-- Sensei Bonus: Display actual visit count -->
    <p>(Actual page visits: {{ request.session.visits }})</p>

    <!-- Ninja Bonus: +2 button -->
    <a href="/plus_two"><button>+2</button></a>

    <!-- Ninja Bonus: Reset button -->
    <a href="/destroy_session"><button>Reset</button></a>

    <hr>

    <!-- Sensei Bonus: Custom increment form -->
    <h3>Custom Increment</h3>
    <form action="/increment" method="post">
        {% csrf_token %}
        <input type="number" name="amount" value="1" min="1">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
