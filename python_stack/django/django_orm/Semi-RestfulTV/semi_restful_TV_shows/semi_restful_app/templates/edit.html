<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Show {{ show.id }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="header">
        <h1>Edit Show {{ show.id }} <a href="/shows">Go Back</a></h1>
    </div>

    <form action="/shows/{{ show.id }}/update" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" value="{{ show.title }}" required>
        </div>
        <div class="form-group">
            <label>Network</label>
            <input type="text" name="network" value="{{ show.network }}" required>
        </div>
        <div class="form-group">
            <label>Release Date</label>
            <!-- Note: date format "Y-m-d" is required for HTML5 date inputs to display the value -->
            <input type="date" name="release_date" value="{{ show.release_date|date:'Y-m-d' }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4">{{ show.description }}</textarea>
        </div>
        <button type="submit">Update</button>
    </form>
    <p><a href="/shows/{{ show.id }}">Go to Show</a></p>
</body>
</html>
