<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Details</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>TV Show {{ show.id }} <a href="/shows">Go Back</a></h1>
    <p>Title: {{ show.title }}</p>
    <p>Network: {{ show.network }}</p>
    <p>Release_date: {{ show.release_date|date:"M d, Y" }}</p>
    <p>Description: {{ show.description }}</p>
    <footer>
        <p><em>Last Updated: {{ show.updated_at|date:"F j, Y g:i a" }}</em></p>
        
        <a href="/shows/{{ show.id }}/edit">Edit</a> | 
        <form action="/shows/{{ show.id }}/destroy" method="POST" style="display:inline;">
        {% csrf_token %}
        <button type="submit" style="background:none; border:none; color:blue; cursor:pointer; text-decoration:underline; padding:0;">Delete</button>
        </form>
    </footer>
</body>
</html>
