<h1>{{author.first_name}} {{author.last_name}}</h1>
<p>ID: {{author.id}}</p>
<p>Notes: {{author.notes}}</p>
<p>Books:</p>
<ul>
    {% for book in author.books.all %}
    <li>{{book.title}}</li>
    {% endfor %}
</ul>
<form action="/join_book" method="POST">
    {% csrf_token %}
    <input type="hidden" name="author_id" value="{{author.id}}">
    <select name="book_id">
        {% for book in not_associated_books %}
        <option value="{{book.id}}">{{book.title}}</option>
        {% endfor %}
    </select>
    <button>Add</button>
</form>
