<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Likes</title>
    <link rel="stylesheet" href="style2.css">
    <script src="script2.js"></script>
</head>

<body>
    <nav>
        <div class="nav-content">Network</div>
    </nav>

    <main>
        <h2 class="page-title">Your Feed</h2>

        <div class="container">
            <div class="profile-card">
                <div class="profile-img">
                    <img src="3135715.png" alt="user">
                </div>
                <a href="#">Add an avatar</a>
                <h3>James Doe</h3>
            </div>

            <div class="like-boxes">
                <div class="post-box">
                    <div class="post-header">
                        <h3>Neil M</h3>
                        <p><span id="likes1">9</span> like(s)</p>
                        <button onclick="addLike1()">Like</button>
                    </div>
                    <p class="post-body">I just set up this new discord bot, let me know what you all think. <a
                            href="#">link</a></p>
                </div>

                <div class="post-box">
                    <div class="post-header">
                        <h3>Nichole K</h3>
                        <p><span id="likes2">12</span> like(s)</p>
                        <button onclick="addLike2()">Like</button>
                    </div>
                    <p class="post-body">Just finished my <a href="#">next comic</a>, check it out.</p>
                </div>

                <div class="post-box">
                    <div class="post-header">
                        <h3>Jim R</h3>
                        <p><span id="likes3">9</span> like(s)</p>
                        <button onclick="addLike3()">Like</button>
                    </div>
                    <p class="post-body">I can't stop listening to the <a href="#">new album</a>. Who else is liking it?
                    </p>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
